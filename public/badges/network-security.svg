<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="netGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Shield Base -->
  <circle cx="200" cy="200" r="175" fill="url(#netGrad)" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#netGlow)" />
  <circle cx="200" cy="200" r="155" fill="none" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Shield Icon -->
  <path d="M 200,95 L 260,120 V 195 C 260,235 200,270 200,270 C 200,270 140,235 140,195 V 120 Z" 
        fill="#0284c7" fill-opacity="0.2" stroke="url(#cyanGrad)" stroke-width="6" />

  <!-- Network Lock / Packet Icon -->
  <circle cx="200" cy="180" r="18" fill="#38bdf8" />
  <path d="M 194,180 V 168 C 194,164 197,161 200,161 C 203,161 206,164 206,168 V 180" 
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <rect x="190" y="177" width="20" height="15" rx="3" fill="#ffffff" />
  <circle cx="200" cy="184" r="2.5" fill="#0f172a" />

  <!-- Text -->
  <text x="200" y="308" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" font-weight="800" fill="#38bdf8" letter-spacing="2">NETWORK SECURITY</text>
  <text x="200" y="328" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">PACKET ANALYSIS &amp; FIREWALLS</text>
</svg>
